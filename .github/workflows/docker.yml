name: Docker

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build-and-push:
    name: Build & push ${{ matrix.app }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            image: retrouveci-api
          - app: client
            image: retrouveci-client
          - app: admin
            image: retrouveci-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `docker/login-action` answers a missing secret with
      # "Username and password required", which names neither the secret nor the
      # place to set it. v0.7.0 was tagged, all three images failed here, and the
      # cause — the repository having no Docker Hub secrets at all — took a log
      # dive to find. Same rule the API applies to its own environment: refuse
      # early, and say what is missing.
      - name: Check the Docker Hub credentials exist
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -n "$USERNAME" ] || missing="$missing DOCKER_USERNAME"
          [ -n "$TOKEN" ] || missing="$missing DOCKER_ACCESS_TOKEN"
          [ -z "$missing" ] && exit 0

          echo "Missing repository secrets:$missing"
          echo
          echo "No image can be built or pushed without them. Create them under"
          echo "Settings -> Secrets and variables -> Actions."
          echo
          echo "DOCKER_USERNAME is also the image namespace, so it must be the"
          echo "Docker Hub account owning retrouveci-api, -client and -admin."
          echo
          echo "Then re-run this workflow. The tag does not need recreating."
          echo "::error title=Docker Hub credentials missing::Missing:$missing"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    name: Trigger Dokploy deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: vars.DOKPLOY_WEBHOOK_URL != ''
    steps:
      - name: Trigger Dokploy webhook
        run: curl -sSf -X POST "${{ vars.DOKPLOY_WEBHOOK_URL }}"
