name: Deploy

on:
  push:
    tags:
      - '*.*.*'

# Images are **not** built here. Dokploy builds each app from its own
# `apps/<app>/Dockerfile` at deploy time, so a second build in CI would only
# publish artefacts nothing pulls. This workflow exists to tell Dokploy that a
# version exists.
jobs:
  deploy:
    name: Trigger Dokploy deployment
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Not `if:`-guarded on purpose. A skipped job leaves a tag with no
      # explanation of why nothing deployed, which is how the Docker Hub
      # credentials went unnoticed until v0.7.0 failed three times.
      - name: Trigger Dokploy webhook
        env:
          WEBHOOK: ${{ vars.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not set, so ${GITHUB_REF_NAME} was not"
            echo "announced to Dokploy. Set it under Settings -> Secrets and"
            echo "variables -> Actions -> Variables to deploy on every tag."
            echo
            echo "Not a failure: Dokploy can also deploy on its own schedule or"
            echo "on a branch it watches. This step only removes the guesswork."
            echo "::notice title=No deployment triggered::DOKPLOY_WEBHOOK_URL is unset"
            exit 0
          fi

          echo "Announcing ${GITHUB_REF_NAME} to Dokploy"
          curl -sSf -X POST "$WEBHOOK"
