name: 🚀 Test CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group:
    test-ci-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  formatcheck:
    name: 🕵️‍♂️ Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: 🕵️‍♂️ Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Type check
        run: pnpm typecheck

  lint:
    name: 🔬 ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Lint
        run: pnpm lint

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      # Component tests run in a real browser (Vitest browser mode), so the
      # `--with-deps` runs `apt-get update`, which fails on **any** broken
      # repository in the runner image — not only the ones it needs. Measured on
      # 2026-09-09: Google's chrome mirror served an inconsistent index
      # (`Hash Sum mismatch`) for over half an hour and took this job down three
      # times in a row, before a single test had run. Playwright's system
      # libraries come from Ubuntu's own repositories, so that one is dead weight.
      # The listing is kept in the log: if the file is ever named otherwise, a
      # silent no-op here would look like the outage coming back.
      - name: Drop the apt repositories Playwright does not need
        run: |
          ls -l /etc/apt/sources.list.d/ || true
          sudo rm -f /etc/apt/sources.list.d/google*.list
          sudo rm -f /etc/apt/sources.list.d/google*.sources

      # Chromium build and its system libraries have to be present before
      # `pnpm test`. One install is enough for both front-ends: Playwright caches
      # browsers per machine, not per workspace.
      - name: Install Playwright browsers
        run: pnpm --filter @app/admin exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test
