name: 🚀 Test CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group:
    test-ci-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

jobs:
  formatcheck:
    name: 🕵️‍♂️ Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: 🕵️‍♂️ Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Type check
        run: pnpm typecheck

  lint:
    name: 🔬 ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      - name: Lint
        run: pnpm lint

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=@app/database

      # Component tests run in a real browser (Vitest browser mode), so the
      # Chromium build and its system libraries have to be present before
      # `pnpm test`. One install is enough for both front-ends: Playwright caches
      # browsers per machine, not per workspace.
      - name: Install Playwright browsers
        run: pnpm --filter @app/admin exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test
